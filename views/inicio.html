<template x-if="view === 'inicio'">
<section id="view-inicio" x-cloak class="space-y-6">

  <!-- ===================== CABECERA DEL CONTENIDO ===================== -->
  <div class="flex flex-col gap-4 lg:flex-row lg:items-start lg:justify-between" data-tour="tour-dashboard">
    <div>
      <h2 class="text-2xl lg:text-[32px] leading-tight font-bold tracking-tight">Resumen financiero</h2>
      <p class="mt-1.5 text-sm text-slate-400 flex items-center gap-1.5">
        <span>Resumen</span>
        <i data-lucide="chevron-right" class="w-3.5 h-3.5"></i>
        <span>Todos los reportes</span>
      </p>
    </div>
    <div class="flex items-center gap-2 flex-wrap">
      <button class="pill pill-ghost" title="Vista">Vista por defecto <i data-lucide="chevron-down" class="w-4 h-4"></i></button>
      <button @click="doExport()" class="pill pill-ghost" title="Exportar datos"><i data-lucide="download" class="w-4 h-4"></i> Exportar</button>
      <button @click="goTo('reportes')" class="circle-btn w-9 h-9" title="Ver reportes" aria-label="Ver reportes"><i data-lucide="file-text" class="w-[18px] h-[18px]"></i></button>
      <button @click="goTo('movimientos')" class="pill pill-ghost" title="Filtrar movimientos"><i data-lucide="sliders-horizontal" class="w-4 h-4"></i> Filtrar</button>
    </div>
  </div>

  <!-- ===================== GRID BENTO ===================== -->
  <div class="grid grid-cols-12 gap-5">

    <!-- 1. DESGLOSE DE GASTOS -->
    <section class="bento col-span-12 xl:col-span-7 p-6">
      <div class="flex flex-wrap items-center justify-between gap-x-3 gap-y-2">
        <h3 class="text-lg font-bold tracking-tight">Desglose de gastos</h3>
        <div class="flex items-center gap-2 shrink-0">
          <button class="pill pill-ghost">Semanal <i data-lucide="chevron-down" class="w-4 h-4"></i></button>
          <button @click="goTo('reportes')" class="circle-btn w-9 h-9" aria-label="Ver detalle"><i data-lucide="arrow-up-right" class="w-4 h-4"></i></button>
        </div>
      </div>

      <div class="mt-4 flex flex-wrap items-end justify-between gap-4">
        <p class="text-4xl font-bold tracking-tight tabular-nums" x-text="fmt(totalExpenses)"></p>
        <!-- Leyenda de intensidad -->
        <div class="grid grid-cols-2 gap-x-5 gap-y-1.5 text-xs text-slate-500 dark:text-slate-300">
          <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full ring-1 ring-black/10 dark:ring-white/20" style="background:var(--dot-1)"></span> Bajo</span>
          <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full ring-1 ring-black/10 dark:ring-white/20" style="background:var(--dot-2)"></span> Medio</span>
          <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full ring-1 ring-black/10 dark:ring-white/20" style="background:var(--dot-3)"></span> Alto</span>
          <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full ring-1 ring-black/10 dark:ring-white/20" style="background:var(--dot-0)"></span> Sin gasto</span>
        </div>
      </div>

      <!-- Matriz: filas = categorías, columnas = días (D L M M J V S) -->
      <div class="mt-6 space-y-3">
        <template x-for="row in weekdayHeatmap" :key="row.cat.id">
          <div class="flex items-center gap-4">
            <span class="w-24 text-sm text-slate-500 dark:text-slate-400 truncate" x-text="row.cat.label"></span>
            <div class="flex-1 grid grid-cols-7 gap-2 justify-items-center">
              <template x-for="(c, i) in row.cells" :key="i">
                <span class="heat-dot" :class="{ 'l1': c.level === 1, 'l2': c.level === 2, 'l3': c.level === 3, 'peak': c.peak }" :title="c.amount > 0 ? fmt(c.amount) : 'Sin gasto'"></span>
              </template>
            </div>
          </div>
        </template>

        <!-- Estado vacío: conserva el layout con placeholders grises -->
        <template x-if="weekdayHeatmap.length === 0">
          <div class="space-y-3">
            <template x-for="r in 3" :key="r">
              <div class="flex items-center gap-4">
                <span class="w-24 h-3 rounded-full bg-slate-100 dark:bg-slate-800"></span>
                <div class="flex-1 grid grid-cols-7 gap-2 justify-items-center">
                  <template x-for="i in 7" :key="i"><span class="heat-dot"></span></template>
                </div>
              </div>
            </template>
            <p class="pt-1 text-xs text-slate-400">Aún no hay gastos este mes. Registra uno para ver el desglose.</p>
          </div>
        </template>

        <!-- Encabezado de días -->
        <div class="flex items-center gap-4 pt-1">
          <span class="w-24"></span>
          <div class="flex-1 grid grid-cols-7 gap-2 justify-items-center text-xs font-medium text-slate-400">
            <template x-for="(d, i) in ['D','L','M','M','J','V','S']" :key="i"><span x-text="d"></span></template>
          </div>
        </div>
      </div>
    </section>

    <!-- COLUMNA DERECHA -->
    <div class="col-span-12 xl:col-span-5 flex flex-col gap-5">

      <!-- 2. BANNER OSCURO -->
      <section class="bento-dark p-6">
        <div class="relative flex flex-col gap-4 sm:flex-row sm:items-center">
          <div class="flex-1 min-w-0">
            <h3 class="text-lg sm:text-xl font-bold leading-snug text-balance">Impulsa tu <span class="font-extrabold">Ahorro</span> inteligente</h3>
            <div class="mt-3 flex flex-wrap items-center gap-2.5">
              <span class="inline-flex items-center rounded-full bg-emerald-400 text-emerald-950 text-xs font-bold px-2.5 py-1 tabular-nums" x-text="`${healthPct}% de ahorro`"></span>
              <span class="text-sm text-white/60">este mes</span>
            </div>
          </div>
          <button @click="goTo('metas')" class="shrink-0 self-start sm:self-auto inline-flex items-center gap-2 rounded-full bg-accent text-white text-sm font-semibold pl-4 pr-2 py-2 transition hover:brightness-110 active:scale-95">
            Crear meta
            <span class="w-7 h-7 rounded-full bg-white/20 grid place-items-center shrink-0"><i data-lucide="arrow-up-right" class="w-4 h-4"></i></span>
          </button>
        </div>
      </section>

      <div class="grid grid-cols-2 gap-5">
        <!-- 3. INGRESOS DE HOY -->
        <section class="bento p-5 flex flex-col justify-between">
          <div class="flex items-start justify-between">
            <span class="w-10 h-10 rounded-full grid place-items-center bg-accent/10 text-accent"><i data-lucide="arrow-down-left" class="w-5 h-5"></i></span>
            <span class="text-xs text-slate-400">Ingresos de hoy</span>
          </div>
          <div class="mt-5">
            <p class="text-2xl font-bold tracking-tight tabular-nums truncate" x-text="fmt(incomeToday.amount)"></p>
            <p class="mt-1 text-xs flex items-center gap-1 tabular-nums"
              :class="!incomeToday.change ? 'text-slate-400' : incomeToday.change.up ? 'text-emerald-500' : 'text-rose-500'">
              <template x-if="incomeToday.change">
                <span class="flex items-center gap-1">
                  <i :data-lucide="incomeToday.change.up ? 'chevron-up' : 'chevron-down'" class="w-3.5 h-3.5"></i>
                  <span x-text="`${incomeToday.change.pct}% vs. ayer`"></span>
                </span>
              </template>
              <span x-show="!incomeToday.change" class="text-slate-400">Sin comparación</span>
            </p>
          </div>
        </section>

        <!-- 4. REPORTE FINANCIERO (negro) -->
        <section class="bento-dark p-5 flex flex-col justify-between">
          <div class="relative flex items-start justify-between">
            <span class="text-xs text-white/50">Ver y descargar reporte</span>
            <div class="flex items-center gap-1.5">
              <button @click="goTo('reportes')" class="w-8 h-8 rounded-full bg-white text-slate-900 grid place-items-center transition hover:brightness-90" aria-label="Ver reporte"><i data-lucide="file-text" class="w-4 h-4"></i></button>
              <button @click="doExport()" class="w-8 h-8 rounded-full bg-white text-slate-900 grid place-items-center transition hover:brightness-90" aria-label="Exportar reporte"><i data-lucide="arrow-up-right" class="w-4 h-4"></i></button>
            </div>
          </div>
          <h3 class="relative mt-5 text-lg font-bold leading-tight">Reporte<br>financiero</h3>
        </section>
      </div>
    </div>

    <!-- 5. FUENTES DE INGRESOS -->
    <section class="bento col-span-12 xl:col-span-8 p-6">
      <div class="flex flex-wrap items-center justify-between gap-3">
        <h3 class="text-lg font-bold tracking-tight">Fuentes de ingresos</h3>
        <div class="flex flex-wrap items-center gap-2">
          <button class="pill pill-ghost">Ordenar por mes <i data-lucide="chevron-down" class="w-4 h-4"></i></button>
          <button @click="goTo('cuentas')" class="pill pill-ghost">Todas las fuentes <i data-lucide="chevron-down" class="w-4 h-4"></i></button>
          <button @click="goTo('reportes')" class="circle-btn w-9 h-9" aria-label="Más"><i data-lucide="more-horizontal" class="w-4 h-4"></i></button>
        </div>
      </div>

      <div class="mt-4 flex items-end gap-4">
        <span class="pill pill-ink">30 días</span>
        <div>
          <p class="text-3xl font-bold tracking-tight tabular-nums" x-text="fmt(incomeSources.total)"></p>
          <p class="text-xs text-slate-400 mt-0.5">Ingresos del mes</p>
        </div>
        <template x-if="incomeSources.change">
          <p class="ml-auto text-2xl font-bold tabular-nums" :class="incomeSources.change.up ? 'text-accent' : 'text-rose-500'"
            x-text="`${incomeSources.change.up ? '+' : '−'}${incomeSources.change.pct}%`"></p>
        </template>
      </div>

      <!-- Barras verticales -->
      <div class="mt-5 h-52 flex items-end gap-4" x-show="incomeSources.rows.length > 0">
        <template x-for="(r, i) in incomeSources.rows" :key="r.acct.id">
          <div class="flex-1 h-full flex flex-col items-center justify-end gap-2 min-w-0">
            <span class="max-w-full inline-flex items-center gap-1 rounded-full bg-white dark:bg-slate-800 shadow-sm border border-slate-100 dark:border-slate-700 px-2 py-1 text-[11px] font-semibold tabular-nums">
              <i data-lucide="arrow-up-right" class="w-3 h-3 text-accent shrink-0"></i>
              <span class="truncate" x-text="fmt(r.amount)"></span>
            </span>
            <div class="vbar w-full transition-all duration-700 ease-out" :class="r.variant === 2 ? 'diag-stripe' : ''"
              :style="`height:${Math.max(8, r.pct)}%; background:${r.variant === 0 ? 'var(--ink)' : 'rgb(var(--accent))'}`"
              :title="r.acct.name"></div>
            <span class="text-[11px] text-slate-400 truncate max-w-full" x-text="r.acct.name"></span>
          </div>
        </template>
      </div>

      <!-- Estado vacío de barras -->
      <div class="mt-5 h-52 flex items-end gap-4" x-show="incomeSources.rows.length === 0">
        <template x-for="h in [40, 70, 55, 85, 50]" :key="h">
          <div class="flex-1 vbar bg-slate-100 dark:bg-slate-800" :style="`height:${h}%`"></div>
        </template>
      </div>
      <p x-show="incomeSources.rows.length === 0" class="mt-3 text-xs text-slate-400">Registra ingresos para ver tus fuentes del mes.</p>
    </section>

    <!-- 6. BALANCE FINANCIERO -->
    <section class="bento col-span-12 xl:col-span-4 p-6 flex flex-col">
      <div class="flex items-center justify-between">
        <h3 class="text-lg font-bold tracking-tight">Balance financiero</h3>
        <button @click="goTo('patrimonio')" class="circle-btn w-9 h-9" aria-label="Ver patrimonio"><i data-lucide="arrow-up-right" class="w-4 h-4"></i></button>
      </div>

      <div class="mt-3 flex items-center gap-4 text-xs text-slate-400">
        <span class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-accent"></span> Total</span>
        <span class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full" style="background:var(--dot-1)"></span> Esta semana</span>
        <span class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-emerald-500"></span> Ganancia hoy</span>
      </div>

      <!-- Medidor semicircular segmentado -->
      <div class="mt-6 flex-1 flex items-end justify-center">
        <div class="gauge">
          <template x-for="(t, i) in gaugeTicks" :key="i">
            <div class="gauge-tick" :class="t.on ? 'on' : ''" :style="`transform: translateX(-50%) rotate(${t.angle}deg)`"><i></i></div>
          </template>
          <div class="absolute inset-x-0 bottom-0 text-center">
            <p class="text-4xl font-bold tracking-tight tabular-nums" x-text="`${healthPct}%`"></p>
            <p class="text-xs text-slate-400">tasa de ahorro</p>
          </div>
        </div>
      </div>

      <!-- Pastilla inferior -->
      <div class="mt-4 flex items-center gap-3 rounded-2xl bg-slate-50 dark:bg-slate-800/60 p-3">
        <p class="flex-1 text-xs text-slate-500 dark:text-slate-400 leading-snug">
          Tu tasa de ahorro es del <span class="font-semibold text-slate-700 dark:text-slate-200 tabular-nums" x-text="`${healthPct}%`"></span> de tus ingresos este mes.
        </p>
        <button @click="goTo('reportes')" class="shrink-0 w-8 h-8 rounded-full bg-accent text-white grid place-items-center transition hover:brightness-110 active:scale-95" aria-label="Ver detalle"><i data-lucide="arrow-up-right" class="w-4 h-4"></i></button>
      </div>
    </section>

  </div>
</section>
</template>
