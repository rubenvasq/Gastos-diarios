    <!-- ============ MODAL: CUENTA ============ -->
    <div x-show="accountModalOpen" x-cloak class="fixed inset-0 z-[60] grid place-items-center p-4">
      <div class="absolute inset-0 bg-slate-900/50 backdrop-blur-sm" @click="accountModalOpen = false"></div>
      <div x-show="accountModalOpen" x-cloak x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0 scale-95" x-transition:enter-end="opacity-100 scale-100"
        role="dialog" aria-modal="true" class="relative w-full max-w-md bg-white dark:bg-slate-900 rounded-3xl border border-slate-200/70 dark:border-slate-800 shadow-2xl p-6 anim-zoom max-h-[92vh] overflow-y-auto">
        <div class="flex items-center justify-between mb-5">
          <h2 class="text-lg font-bold tracking-tight" x-text="accountForm?.id ? 'Editar cuenta' : 'Nueva cuenta'"></h2>
          <button @click="accountModalOpen = false" class="btn-icon w-9 h-9" aria-label="Cerrar"><i data-lucide="x" class="w-5 h-5"></i></button>
        </div>

        <template x-if="accountForm">
          <form @submit.prevent="submitAccount" class="flex flex-col gap-4">
            <div>
              <label class="form-label">Nombre</label>
              <input type="text" x-model="accountForm.name" maxlength="40" placeholder="Ej. Banco principal" class="field">
            </div>

            <div>
              <label class="form-label">Tipo</label>
              <select x-model="accountForm.type" class="field" @change="accountForm.icon = accountTypes.find(t => t.id === accountForm.type)?.icon ?? accountForm.icon">
                <template x-for="t in accountTypes" :key="t.id">
                  <option :value="t.id" x-text="t.label"></option>
                </template>
              </select>
            </div>

            <div>
              <span class="form-label">Icono</span>
              <div class="flex flex-wrap gap-1.5">
                <template x-for="ic in accountIcons" :key="ic">
                  <button type="button" @click="accountForm.icon = ic" class="w-9 h-9 rounded-xl grid place-items-center transition"
                    :class="accountForm.icon === ic ? 'bg-accent text-white shadow-sm' : 'bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400 hover:bg-slate-200 dark:hover:bg-slate-700'">
                    <i :data-lucide="ic" class="w-4 h-4"></i>
                  </button>
                </template>
              </div>
            </div>

            <div>
              <span class="form-label">Color</span>
              <div class="flex flex-wrap gap-2">
                <template x-for="p in config.accentPresets" :key="p.value">
                  <button type="button" @click="accountForm.color = p.value" class="w-7 h-7 rounded-full transition hover:scale-110"
                    :class="accountForm.color === p.value ? 'ring-2 ring-offset-2 ring-offset-white dark:ring-offset-slate-900' : ''"
                    :style="`background:${p.value}; --tw-ring-color:${p.value}`"></button>
                </template>
                <label class="w-7 h-7 rounded-full grid place-items-center border-2 border-dashed border-slate-300 dark:border-slate-600 cursor-pointer text-slate-400" title="Personalizado">
                  <i data-lucide="pipette" class="w-3.5 h-3.5"></i>
                  <input type="color" x-model="accountForm.color" class="sr-only">
                </label>
              </div>
            </div>

            <div>
              <label class="form-label">Saldo inicial</label>
              <div class="flex items-center gap-2">
                <input type="number" step="0.01" x-model="accountForm.balance" class="field flex-1 tabular-nums">
              </div>
              <div class="flex items-center gap-1.5 mt-2">
                <button type="button" @click="adjustBalance(-100000)" class="btn-ghost py-1 px-2.5 text-xs">−100k</button>
                <button type="button" @click="adjustBalance(-10000)" class="btn-ghost py-1 px-2.5 text-xs">−10k</button>
                <button type="button" @click="adjustBalance(10000)" class="btn-ghost py-1 px-2.5 text-xs">+10k</button>
                <button type="button" @click="adjustBalance(100000)" class="btn-ghost py-1 px-2.5 text-xs">+100k</button>
              </div>
            </div>

            <div class="flex items-center justify-between">
              <div>
                <span class="form-label mb-0">Estado</span>
                <p class="text-xs text-slate-400" x-text="accountForm.status === 'activa' ? 'Visible en el balance y movimientos' : 'Oculta de los totales activos'"></p>
              </div>
              <button type="button" @click="accountForm.status = accountForm.status === 'activa' ? 'inactiva' : 'activa'"
                class="relative w-12 h-7 rounded-full transition" :class="accountForm.status === 'activa' ? 'bg-accent' : 'bg-slate-300 dark:bg-slate-600'">
                <span class="absolute top-1 w-5 h-5 rounded-full bg-white shadow transition-all" :class="accountForm.status === 'activa' ? 'left-6' : 'left-1'"></span>
              </button>
            </div>

            <button type="submit" class="inline-flex items-center justify-center gap-2 w-full rounded-2xl px-4 py-3.5 text-sm font-semibold text-white bg-accent shadow-lg shadow-accent/30 transition hover:brightness-110 hover:-translate-y-px active:scale-[.98]">
              <i data-lucide="check" class="w-[18px] h-[18px]"></i>
              <span x-text="accountForm.id ? 'Guardar cambios' : 'Crear cuenta'"></span>
            </button>
          </form>
        </template>
      </div>
    </div>
