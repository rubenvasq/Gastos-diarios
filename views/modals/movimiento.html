    <!-- ============ MODAL: MOVIMIENTO ============ -->
    <div x-show="modalOpen" x-cloak class="fixed inset-0 z-[60] grid place-items-center p-4">
      <div class="absolute inset-0 bg-slate-900/50 backdrop-blur-sm" @click="modalOpen = false"></div>
      <div x-show="modalOpen" x-cloak x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0 scale-95" x-transition:enter-end="opacity-100 scale-100"
        role="dialog" aria-modal="true" class="relative w-full max-w-md bg-white dark:bg-slate-900 rounded-3xl border border-slate-200/70 dark:border-slate-800 shadow-2xl p-6 anim-zoom max-h-[92vh] overflow-y-auto">
        <div class="flex items-center justify-between mb-5">
          <h2 class="text-lg font-bold tracking-tight" x-text="editingId ? 'Editar movimiento' : 'Nuevo movimiento'"></h2>
          <button @click="modalOpen = false" class="btn-icon w-9 h-9" aria-label="Cerrar"><i data-lucide="x" class="w-5 h-5"></i></button>
        </div>

        <div class="flex items-center gap-1 bg-slate-100 dark:bg-slate-800 rounded-2xl p-1 mb-5 text-sm font-medium">
          <button @click="entryType = 'expense'" class="flex-1 py-2 rounded-xl transition" :class="entryType === 'expense' ? 'bg-white dark:bg-slate-700 shadow-sm text-rose-500' : 'text-slate-500 dark:text-slate-400'">
            <i data-lucide="credit-card" class="w-4 h-4 inline mr-1.5"></i>Gasto
          </button>
          <button @click="entryType = 'income'" class="flex-1 py-2 rounded-xl transition" :class="entryType === 'income' ? 'bg-white dark:bg-slate-700 shadow-sm text-emerald-500' : 'text-slate-500 dark:text-slate-400'">
            <i data-lucide="trending-up" class="w-4 h-4 inline mr-1.5"></i>Ingreso
          </button>
          <button @click="entryType = 'transfer'" class="flex-1 py-2 rounded-xl transition" :class="entryType === 'transfer' ? 'bg-white dark:bg-slate-700 shadow-sm text-sky-500' : 'text-slate-500 dark:text-slate-400'">
            <i data-lucide="arrow-right-left" class="w-4 h-4 inline mr-1.5"></i>Transferencia
          </button>
        </div>

        <form @submit.prevent="submitTx" class="flex flex-col gap-4">
          <div>
            <label class="form-label" for="amount">Monto</label>
            <div class="flex items-center gap-2 rounded-2xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800/60 pl-4 transition focus-within:border-accent focus-within:ring-4 focus-within:ring-accent/15">
              <span class="font-semibold text-slate-400">$</span>
              <input id="amount" type="number" min="0.01" step="0.01" x-model="form.amount" placeholder="0.00" class="flex-1 bg-transparent py-3 pr-4 outline-none text-[15px] tabular-nums">
            </div>
          </div>

          <div x-show="entryType === 'expense'">
            <label class="form-label" for="category">Categoría</label>
            <select id="category" x-model="form.category" class="field">
              <template x-for="c in categories" :key="c.id">
                <option :value="c.id" x-text="`${c.emoji}  ${c.label}`"></option>
              </template>
            </select>
          </div>

          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="form-label" :for="entryType === 'transfer' ? 'from' : 'account'" x-text="entryType === 'transfer' ? 'Desde' : 'Cuenta'"></label>
              <select :id="entryType === 'transfer' ? 'from' : 'account'" x-model="form.account" class="field">
                <template x-for="a in accounts" :key="a.id">
                  <option :value="a.id" x-text="a.name"></option>
                </template>
              </select>
            </div>
            <div x-show="entryType === 'transfer'">
              <label class="form-label" for="toAccount">Hacia</label>
              <select id="toAccount" x-model="form.toAccount" class="field">
                <template x-for="a in accounts" :key="a.id">
                  <option :value="a.id" x-text="a.name"></option>
                </template>
              </select>
            </div>
            <div x-show="entryType !== 'transfer'">
              <label class="form-label" for="date">Fecha</label>
              <input id="date" type="date" x-model="form.date" class="field">
            </div>
            <div x-show="entryType === 'transfer'">
              <label class="form-label" for="date">Fecha</label>
              <input id="date" type="date" x-model="form.date" class="field">
            </div>
          </div>

          <div>
            <label class="form-label" for="description">Descripción</label>
            <input id="description" type="text" maxlength="100" x-model="form.description" placeholder="Ej. Supermercado, Nómina…" class="field">
          </div>

          <div>
            <label class="form-label" for="note">Notas (opcional)</label>
            <textarea id="note" rows="2" maxlength="500" x-model="form.note" placeholder="Detalles extra…" class="field resize-none"></textarea>
          </div>

          <!-- Comprobantes -->
          <div x-show="entryType !== 'transfer'">
            <label class="form-label">Comprobantes (JPG, PNG o WEBP)</label>
            <label class="flex items-center justify-center gap-2 rounded-2xl border-2 border-dashed border-slate-300 dark:border-slate-700 px-4 py-5 text-sm text-slate-500 dark:text-slate-400 cursor-pointer transition hover:border-accent hover:text-accent">
              <i data-lucide="paperclip" class="w-4 h-4"></i> Adjuntar imagen
              <input type="file" accept="image/jpeg,image/png,image/webp" class="hidden" @change="onReceiptFile">
            </label>
            <template x-if="form.receipts.length > 0">
              <div class="flex flex-wrap gap-2 mt-2">
                <template x-for="(r, i) in form.receipts" :key="i">
                  <div class="relative">
                    <img :src="r.dataUrl" alt="Comprobante pendiente" class="w-16 h-16 object-cover rounded-xl border border-slate-200 dark:border-slate-700">
                    <button @click="dropPendingReceipt(i)" type="button" class="absolute -top-1.5 -right-1.5 w-5 h-5 rounded-full bg-rose-500 text-white grid place-items-center" title="Quitar"><i data-lucide="x" class="w-3 h-3"></i></button>
                  </div>
                </template>
              </div>
            </template>
            <template x-if="editingId && $data.receiptsFor(editingId).length > 0">
              <div class="mt-2">
                <p class="text-xs text-slate-400 mb-1.5">Adjuntados:</p>
                <div class="flex flex-wrap gap-2">
                  <template x-for="r in $data.receiptsFor(editingId)" :key="r.id">
                    <div class="relative group">
                      <a :href="r.dataUrl" target="_blank" rel="noopener" title="Ver comprobante">
                        <img :src="r.dataUrl" alt="Comprobante" class="w-16 h-16 object-cover rounded-xl border border-slate-200 dark:border-slate-700">
                      </a>
                      <button @click="removeReceipt(editingId, r.id)" type="button" class="absolute -top-1.5 -right-1.5 w-5 h-5 rounded-full bg-rose-500 text-white grid place-items-center" title="Eliminar"><i data-lucide="x" class="w-3 h-3"></i></button>
                    </div>
                  </template>
                </div>
              </div>
            </template>
          </div>

          <p x-show="formError" class="text-[13px] font-medium px-3.5 py-2.5 rounded-2xl bg-rose-50 text-rose-600 dark:bg-rose-500/10 dark:text-rose-400 flex items-center gap-2">
            <i data-lucide="triangle-alert" class="w-4 h-4 shrink-0"></i><span x-text="formError"></span>
          </p>

          <button type="submit"
            class="inline-flex items-center justify-center gap-2 w-full rounded-2xl px-4 py-3.5 text-sm font-semibold text-white shadow-lg transition hover:brightness-110 hover:-translate-y-px active:scale-[.98]"
            :class="entryType === 'income' ? 'bg-gradient-to-tr from-emerald-400 to-emerald-600 shadow-emerald-500/30' : entryType === 'transfer' ? 'bg-gradient-to-tr from-sky-400 to-sky-600 shadow-sky-500/30' : 'bg-accent shadow-accent/30'">
            <i :data-lucide="entryType === 'income' ? 'arrow-down-left' : entryType === 'transfer' ? 'arrow-right-left' : 'plus'" class="w-[18px] h-[18px]"></i>
            <span x-text="editingId ? 'Guardar cambios' : entryType === 'income' ? 'Registrar ingreso' : entryType === 'transfer' ? 'Registrar transferencia' : 'Registrar gasto'"></span>
          </button>
        </form>
      </div>
    </div>
