    <!-- ============ MODAL: REASIGNAR CATEGORÍA ============ -->
    <div x-show="reassignOpen" x-cloak class="fixed inset-0 z-[70] grid place-items-center p-4">
      <div class="absolute inset-0 bg-slate-900/50 backdrop-blur-sm" @click="reassignOpen = false"></div>
      <div x-show="reassignOpen" x-cloak x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0 scale-95" x-transition:enter-end="opacity-100 scale-100"
        role="dialog" aria-modal="true" class="relative w-full max-w-sm bg-white dark:bg-slate-900 rounded-3xl border border-slate-200/70 dark:border-slate-800 shadow-2xl p-6 anim-zoom">
        <div class="flex items-center justify-between mb-4">
          <h3 class="font-bold flex items-center gap-2"><i data-lucide="arrow-right-left" class="w-4 h-4 text-accent"></i> Reasignar movimientos</h3>
          <button @click="reassignOpen = false" class="btn-icon w-8 h-8" aria-label="Cerrar"><i data-lucide="x" class="w-4 h-4"></i></button>
        </div>
        <p class="text-sm text-slate-500 dark:text-slate-400 mb-4 leading-relaxed">
          Esta categoría tiene <b x-text="categoryUsage(reassignCatId)"></b> movimiento(s) asociado(s). Elige a qué categoría moverlos antes de eliminarla:
        </p>
        <select x-model="reassignTarget" class="field mb-5">
          <template x-for="c in categories" :key="c.id">
            <template x-if="c.id !== reassignCatId">
              <option :value="c.id" x-text="c.label"></option>
            </template>
          </template>
        </select>
        <div class="flex gap-3">
          <button @click="reassignOpen = false" class="btn-ghost flex-1 justify-center">Cancelar</button>
          <button @click="confirmReassign" class="flex-1 inline-flex items-center justify-center gap-2 rounded-2xl px-4 py-2.5 text-sm font-semibold text-white bg-accent shadow-lg shadow-accent/30 transition hover:brightness-110 active:scale-[.98]">
            Reasignar y eliminar
          </button>
        </div>
      </div>
    </div>
