    <!-- ============ MODAL: RECURRENTE ============ -->
    <div x-show="recModalOpen" x-cloak class="fixed inset-0 z-[60] grid place-items-center p-4">
      <div class="absolute inset-0 bg-slate-900/50 backdrop-blur-sm" @click="recModalOpen = false"></div>
      <div x-show="recModalOpen" x-cloak x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0 scale-95" x-transition:enter-end="opacity-100 scale-100"
        role="dialog" aria-modal="true" class="relative w-full max-w-md bg-white dark:bg-slate-900 rounded-3xl border border-slate-200/70 dark:border-slate-800 shadow-2xl p-6 anim-zoom">
        <div class="flex items-center justify-between mb-5">
          <h2 class="text-lg font-bold tracking-tight" x-text="recForm?.id ? 'Editar recurrente' : 'Nuevo recurrente'"></h2>
          <button @click="recModalOpen = false" class="btn-icon w-9 h-9" aria-label="Cerrar"><i data-lucide="x" class="w-5 h-5"></i></button>
        </div>

        <template x-if="recForm">
          <form @submit.prevent="submitRecurring" class="flex flex-col gap-4">
            <div>
              <label class="form-label">Nombre</label>
              <input type="text" x-model="recForm.name" maxlength="60" placeholder="Ej. Netflix, Internet, Gimnasio…" class="field">
            </div>

            <div>
              <label class="form-label">Monto</label>
              <input type="number" min="0.01" step="0.01" x-model="recForm.amount" placeholder="0.00" class="field tabular-nums">
            </div>

            <div class="grid grid-cols-2 gap-4">
              <div>
                <label class="form-label">Categoría</label>
                <select x-model="recForm.category" class="field">
                  <template x-for="c in categories" :key="c.id">
                    <option :value="c.id" x-text="`${c.emoji}  ${c.label}`"></option>
                  </template>
                </select>
              </div>
              <div>
                <label class="form-label">Cuenta</label>
                <select x-model="recForm.account" class="field">
                  <template x-for="a in accounts" :key="a.id">
                    <option :value="a.id" x-text="a.name"></option>
                  </template>
                </select>
              </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
              <div>
                <label class="form-label">Frecuencia</label>
                <select x-model="recForm.frequency" class="field">
                  <option value="mensual">Cada mes</option>
                  <option value="semanal">Cada semana</option>
                  <option value="quincenal">Cada quincena</option>
                  <option value="anual">Cada año</option>
                </select>
              </div>
              <div>
                <label class="form-label">Próxima fecha</label>
                <input type="date" x-model="recForm.nextDate" class="field">
              </div>
            </div>

            <label class="flex items-center justify-between p-3 rounded-2xl bg-slate-50 dark:bg-slate-800/60 cursor-pointer">
              <span class="text-sm font-medium">Activo</span>
              <span class="relative w-12 h-7 rounded-full transition" :class="recForm.active ? 'bg-accent' : 'bg-slate-300 dark:bg-slate-600'">
                <input type="checkbox" class="sr-only" x-model="recForm.active">
                <span class="absolute top-1 w-5 h-5 rounded-full bg-white shadow transition-all" :class="recForm.active ? 'left-6' : 'left-1'"></span>
              </span>
            </label>

            <button type="submit" class="inline-flex items-center justify-center gap-2 w-full rounded-2xl px-4 py-3.5 text-sm font-semibold text-white bg-accent shadow-lg shadow-accent/30 transition hover:brightness-110 hover:-translate-y-px active:scale-[.98]">
              <i data-lucide="check" class="w-[18px] h-[18px]"></i>
              <span x-text="recForm.id ? 'Guardar cambios' : 'Crear recurrente'"></span>
            </button>
          </form>
        </template>
      </div>
    </div>
