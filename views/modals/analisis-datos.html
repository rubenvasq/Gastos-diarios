    <!-- ============ MODAL: ANÁLISIS DE DATOS ============ -->
    <div x-show="analysisOpen" x-cloak class="fixed inset-0 z-[70] grid place-items-center p-4">
      <div class="absolute inset-0 bg-slate-900/50 backdrop-blur-sm" @click="analysisOpen = false"></div>
      <div x-show="analysisOpen" x-cloak x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0 scale-95" x-transition:enter-end="opacity-100 scale-100"
        role="dialog" aria-modal="true" class="relative w-full max-w-lg bg-white dark:bg-slate-900 rounded-3xl border border-slate-200/70 dark:border-slate-800 shadow-2xl p-6 anim-zoom">
        <div class="flex items-center justify-between mb-4">
          <h3 class="font-bold flex items-center gap-2"><i data-lucide="shield-check" class="w-4 h-4 text-accent"></i> Analizar datos</h3>
          <button @click="analysisOpen = false" class="btn-icon w-8 h-8" aria-label="Cerrar"><i data-lucide="x" class="w-4 h-4"></i></button>
        </div>

        <template x-if="analysis">
          <div>
            <div class="rounded-2xl px-4 py-3 mb-4"
              :class="analysis.ok ? 'bg-emerald-50 text-emerald-600 dark:bg-emerald-500/10 dark:text-emerald-400' : 'bg-amber-50 text-amber-600 dark:bg-amber-500/10 dark:text-amber-400'">
              <p class="flex items-center gap-2 text-sm font-semibold">
                <i :data-lucide="analysis.ok ? 'circle-check' : 'triangle-alert'" class="w-4 h-4"></i>
                <span x-text="analysis.summary"></span>
              </p>
              <p x-show="!analysis.ok" class="text-xs font-normal mt-1 text-slate-500 dark:text-slate-400"
                x-text="analysis.counts.error + ' error(es) · ' + analysis.counts.warning + ' advertencia(s)'"></p>
            </div>

            <p x-show="analysisFixed" class="text-xs text-emerald-600 dark:text-emerald-400 mb-3">
              ✓ <span x-text="analysisFixed"></span> correcciones seguras aplicadas.
            </p>

            <template x-if="!analysis.ok">
              <div class="space-y-2 max-h-56 overflow-y-auto pr-1 mb-4">
                <template x-for="(it, i) in analysis.issues" :key="i">
                  <div class="flex items-start gap-2 rounded-xl border border-slate-100 dark:border-slate-800 px-3 py-2">
                    <i :data-lucide="it.level === 'error' ? 'circle-x' : 'triangle-alert'" class="w-4 h-4 mt-0.5 shrink-0"
                      :class="it.level === 'error' ? 'text-rose-500' : 'text-amber-500'"></i>
                    <p class="text-xs text-slate-600 dark:text-slate-300 leading-relaxed">
                      <span class="font-semibold uppercase tracking-wide text-[10px] text-slate-400" x-text="it.area"></span>
                      — <span x-text="it.message"></span>
                    </p>
                  </div>
                </template>
              </div>
            </template>

            <div class="flex gap-3">
              <button @click="analysisOpen = false" class="btn-ghost flex-1 justify-center">Cerrar</button>
              <button x-show="!analysis.ok" @click="applySafeFixes"
                class="flex-1 inline-flex items-center justify-center gap-2 rounded-2xl px-4 py-2.5 text-sm font-semibold text-white bg-accent shadow-lg shadow-accent/30 transition hover:brightness-110 active:scale-[.98]">
                <i data-lucide="wand-2" class="w-4 h-4"></i> Aplicar correcciones seguras
              </button>
            </div>
          </div>
        </template>
      </div>
    </div>
