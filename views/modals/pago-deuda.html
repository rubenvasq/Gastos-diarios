    <!-- ============ MODAL: PAGO DE DEUDA ============ -->
    <div x-show="debtPayOpen" x-cloak class="fixed inset-0 z-[60] grid place-items-center p-4">
      <div class="absolute inset-0 bg-slate-900/50 backdrop-blur-sm" @click="debtPayOpen = false"></div>
      <div x-show="debtPayOpen" x-cloak x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0 scale-95" x-transition:enter-end="opacity-100 scale-100"
        role="dialog" aria-modal="true" class="relative w-full max-w-sm bg-white dark:bg-slate-900 rounded-3xl border border-slate-200/70 dark:border-slate-800 shadow-2xl p-6 anim-zoom">
        <div class="flex items-center justify-between mb-4">
          <h3 class="font-bold flex items-center gap-2"><i data-lucide="wallet" class="w-5 h-5 text-accent"></i> Pagar cuota</h3>
          <button @click="debtPayOpen = false" class="btn-icon w-9 h-9" aria-label="Cerrar"><i data-lucide="x" class="w-5 h-5"></i></button>
        </div>
        <p class="text-xs text-slate-400 mb-4">El pago se descuenta del saldo de la deuda y se registra como gasto en la cuenta elegida.</p>
        <div class="space-y-4">
          <div>
            <label class="form-label">Cuenta</label>
            <select x-model="debtPayment.account" class="field">
              <template x-for="a in activeAccounts" :key="a.id">
                <option :value="a.id" x-text="a.name"></option>
              </template>
            </select>
          </div>
          <div>
            <label class="form-label">Monto</label>
            <input type="number" min="0" step="0.01" x-model="debtPayment.amount" class="field" placeholder="0">
          </div>
          <button @click="submitDebtPayment" class="w-full inline-flex items-center justify-center gap-2 rounded-2xl bg-accent text-white px-4 py-2.5 text-sm font-semibold shadow-lg shadow-accent/30 transition hover:brightness-110 active:scale-[.98]">
            Registrar pago
          </button>
        </div>
      </div>
    </div>
