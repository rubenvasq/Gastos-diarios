<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="GastosDiarios — Gestión financiera personal: cuentas, movimientos, presupuestos, reportes, calendario y más.">
  <meta name="theme-color" content="#1F6BFF">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GastosDiarios">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <!-- iOS ignora SVG para el ícono de inicio: usa el PNG a sangre completa -->
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <title>GastosDiarios — Gestión financiera</title>

  <!-- Tipografía (Inter vendorizado: subsets latin/latin-ext, offline) -->
  <link rel="stylesheet" href="vendor/inter.css">

  <!-- Frameworks (vendorizados en /vendor, sin CDN, offline) -->
  <script src="vendor/tailwind.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: { accent: 'rgb(var(--accent) / <alpha-value>)' },
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'Segoe UI', 'Roboto', 'sans-serif'],
          },
        },
      },
    };
  </script>
  <style type="text/tailwindcss">
    @layer components {
      .card { @apply bg-white dark:bg-[#15161D] rounded-3xl border border-[#EBEBF1] dark:border-white/[0.06] p-6 shadow-[0_1px_2px_rgba(16,16,30,.04),0_10px_30px_-18px_rgba(16,16,30,.14)] dark:shadow-none; }
      .btn-ghost { @apply inline-flex items-center gap-2 rounded-2xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 px-3.5 py-2 text-sm font-medium text-slate-600 dark:text-slate-300 transition hover:bg-slate-50 dark:hover:bg-slate-800 hover:text-slate-900 dark:hover:text-white active:scale-95; }
      /* Botón primario con gradiente de marca */
      .btn-primary { @apply inline-flex items-center justify-center gap-2 rounded-2xl px-4 py-2.5 text-sm font-semibold text-white shadow-lg shadow-accent/30 transition hover:brightness-110 hover:shadow-xl active:scale-[.98]; background-image: var(--brand-gradient); }
      .btn-icon { @apply inline-flex items-center justify-center w-10 h-10 rounded-2xl text-slate-500 dark:text-slate-400 transition hover:bg-slate-100 dark:hover:bg-slate-800 hover:text-slate-900 dark:hover:text-white active:scale-95; }
      .nav-link { @apply flex items-center gap-3 rounded-2xl px-3.5 py-2.5 text-sm font-medium text-slate-500 dark:text-slate-400 transition hover:bg-slate-100 dark:hover:bg-slate-800 hover:text-slate-900 dark:hover:text-slate-100; }
      /* Nav activo: pastilla con gradiente de marca y texto blanco */
      .nav-link-active { @apply text-white shadow-md shadow-accent/30 hover:text-white dark:hover:text-white; background-image: var(--brand-gradient); }
      .nav-link-active:hover { background-color: transparent; }
      .field { @apply w-full rounded-2xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800/60 px-3.5 py-2.5 text-[15px] outline-none transition focus:border-accent focus:ring-4 focus:ring-accent/15; }
      .form-label { @apply block text-[13px] font-medium text-slate-500 dark:text-slate-400 mb-1.5; }
      .chip { @apply inline-flex items-center gap-1.5 rounded-full px-3 py-1 text-xs font-semibold bg-slate-100 text-slate-500 dark:bg-slate-800 dark:text-slate-400 transition; }
      .chip-active { @apply bg-accent/10 text-accent dark:bg-accent/15; }
      /* Tarjeta teñida con gradiente suave + orbe de glow */
      .card-tint { @apply relative overflow-hidden rounded-3xl border border-slate-200/60 dark:border-slate-800 p-5 transition; }
      .glow-orb { @apply absolute rounded-full opacity-20 blur-2xl pointer-events-none transition-transform duration-500; }
    }
  </style>

  <link rel="stylesheet" href="styles/main.css">

  <!-- En la app nativa (Capacitor) los archivos ya viajan dentro del APK: el
       service worker no aporta nada y puede seguir sirviendo el JS/HTML de una
       instalación anterior tras actualizar. Lo desregistramos y limpiamos sus
       cachés antes de cargar la app. Si esta carga estaba controlada por un SW
       viejo, recargamos una vez para usar el código del APK nuevo. -->
  <script>
    (function () {
      var cap = window.Capacitor;
      var native = (cap && typeof cap.isNativePlatform === 'function' && cap.isNativePlatform())
        || location.protocol === 'capacitor:'
        || (location.protocol === 'https:' && location.hostname === 'localhost');
      if (!native) return;
      window.__GD_NATIVE__ = true;
      if (!('serviceWorker' in navigator)) return;

      var cleanup = navigator.serviceWorker.getRegistrations()
        .then(function (regs) { return Promise.all(regs.map(function (r) { return r.unregister(); })); })
        .then(function () { return window.caches ? caches.keys() : []; })
        .then(function (keys) { return Promise.all((keys || []).map(function (k) { return caches.delete(k); })); })
        .catch(function () {});

      try {
        if (navigator.serviceWorker.controller && !sessionStorage.getItem('gd-sw-cleaned')) {
          sessionStorage.setItem('gd-sw-cleaned', '1');
          cleanup.then(function () { location.reload(); });
        }
      } catch (e) { /* sin sessionStorage: seguimos sin recargar */ }
    })();
  </script>

  <!-- App (módulo): importa y arranca Alpine tras precargar IndexedDB. Lucide y Chart.js vendorizados. -->
  <script type="module" src="src/app.js"></script>
  <script defer src="vendor/lucide.min.js"></script>
  <script defer src="vendor/chart.umd.min.js"></script>
</head>

<body class="min-h-screen text-[#111318] dark:text-slate-100 antialiased">
  <div x-data="app" x-cloak class="min-h-screen">

    <!-- ============ BIENVENIDA (solo primera instalación) ============ -->
    <div x-show="!onboarded" x-cloak class="fixed inset-0 z-[95] overflow-hidden grid place-items-center p-6 text-white" style="background-image: var(--brand-gradient)">
      <div class="absolute -top-24 -right-24 w-72 h-72 rounded-full bg-white/10 blur-3xl anim-float"></div>
      <div class="absolute bottom-0 -left-16 w-60 h-60 rounded-full bg-white/10 blur-3xl anim-float" style="animation-delay:1.1s"></div>

      <div class="relative w-full max-w-sm text-center text-white">
        <template x-for="(s, i) in onboardSlides" :key="i">
          <div x-show="onboardStep === i"
            x-transition:enter="transition ease-out duration-300" x-transition:enter-start="opacity-0 translate-x-6" x-transition:enter-end="opacity-100 translate-x-0"
            x-transition:leave="transition ease-in duration-150" x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0 -translate-x-6">
            <div class="w-24 h-24 mx-auto mb-7 rounded-[28px] bg-white/15 backdrop-blur grid place-items-center anim-float shadow-2xl">
              <i :data-lucide="s.icon" class="w-11 h-11"></i>
            </div>
            <h2 class="text-2xl font-bold tracking-tight mb-2 text-white" x-text="s.title"></h2>
            <p class="text-sm text-white/90 leading-relaxed px-2.5" x-text="s.text"></p>
          </div>
        </template>

        <div class="flex items-center justify-center gap-2 mt-9 mb-7">
          <template x-for="(s, i) in onboardSlides" :key="'dot' + i">
            <button @click="onboardStep = i" class="h-2 rounded-full transition-all" :class="onboardStep === i ? 'w-7 bg-white' : 'w-2 bg-white/35'" :aria-label="`Ir a diapositiva ${i + 1}`"></button>
          </template>
        </div>

        <div class="flex items-center gap-3">
          <button x-show="onboardStep < onboardSlides.length - 1" @click="finishOnboarding()" class="flex-1 py-3 rounded-2xl text-sm font-semibold text-white/80 hover:text-white transition">Omitir</button>
          <button x-show="onboardStep < onboardSlides.length - 1" @click="onboardStep++" class="flex-[2] py-3 rounded-2xl text-sm font-semibold bg-white text-slate-900 shadow-lg transition hover:brightness-95 active:scale-[.98]">Siguiente</button>
          <button x-show="onboardStep === onboardSlides.length - 1" @click="finishOnboarding()" class="flex-1 py-3 rounded-2xl text-sm font-semibold bg-white text-slate-900 shadow-lg transition hover:brightness-95 active:scale-[.98]">Comenzar</button>
        </div>
      </div>
    </div>

    <!-- ============ AUTENTICACIÓN (cuenta local, sin backend) ============ -->
    <div x-show="onboarded && !authed" x-cloak class="fixed inset-0 z-[93] overflow-y-auto" style="background: var(--bg)">
      <div class="auth-blob"></div>

      <div class="relative w-full max-w-sm mx-auto px-6 pt-8 pb-10 min-h-screen flex flex-col justify-center">
        <!-- Fila superior: flecha de regreso en pantallas secundarias (reserva su alto siempre) -->
        <div class="h-10 mb-8 flex items-center">
          <button x-show="authScreen === 'register' || authScreen === 'forgot'" x-cloak
            @click="switchAuthScreen(hasLocalAccount ? 'login' : 'register')" class="btn-icon"
            style="background: var(--surface); border: 1px solid var(--border)" aria-label="Volver">
            <i data-lucide="chevron-left" class="w-5 h-5"></i>
          </button>
        </div>

        <!-- LOGIN -->
        <template x-if="authScreen === 'login'">
          <div class="anim-rise">
            <h2 class="text-[28px] leading-tight font-bold tracking-tight mb-1.5" style="color: var(--text)">Inicia sesión</h2>
            <p class="text-sm mb-7" style="color: var(--text-muted)">
              ¿No tienes cuenta?
              <button type="button" @click="switchAuthScreen('register')" class="auth-link">Crear cuenta</button>
            </p>
            <form @submit.prevent="submitLogin" class="flex flex-col gap-3.5">
              <label class="auth-field">
                <i data-lucide="user" class="w-[18px] h-[18px]"></i>
                <input type="text" autocomplete="username" x-model="authForm.username" placeholder="Usuario" required>
              </label>
              <div>
                <label class="auth-field">
                  <i data-lucide="lock" class="w-[18px] h-[18px]"></i>
                  <input type="password" autocomplete="current-password" x-model="authForm.password" placeholder="Contraseña" required>
                </label>
                <button type="button" @click="switchAuthScreen('forgot')" class="auth-link text-[13px] mt-2 ml-1">¿Olvidaste tu contraseña?</button>
              </div>
              <p x-show="authError" class="text-[13px] font-medium text-rose-500 dark:text-rose-400" x-text="authError"></p>
              <button type="submit" :disabled="authBusy" class="auth-cta mt-3 self-end">
                <span x-show="!authBusy">Iniciar sesión</span>
                <span x-show="authBusy">Verificando…</span>
                <i data-lucide="arrow-right" class="w-4 h-4"></i>
              </button>
            </form>
          </div>
        </template>

        <!-- REGISTRO -->
        <template x-if="authScreen === 'register'">
          <div class="anim-rise">
            <h2 class="text-[28px] leading-tight font-bold tracking-tight mb-1.5" style="color: var(--text)">Crea tu cuenta</h2>
            <p class="text-sm mb-7" style="color: var(--text-muted)">
              <template x-if="hasLocalAccount">
                <span>¿Ya tienes cuenta? <button type="button" @click="switchAuthScreen('login')" class="auth-link">Iniciar sesión</button></span>
              </template>
              <template x-if="!hasLocalAccount">
                <span>Tus datos no salen de este dispositivo.</span>
              </template>
            </p>
            <form @submit.prevent="submitRegister" class="flex flex-col gap-3.5">
              <label class="auth-field">
                <i data-lucide="user" class="w-[18px] h-[18px]"></i>
                <input type="text" autocomplete="username" x-model="authForm.username" placeholder="Usuario (3-30 caracteres)" required>
              </label>
              <label class="auth-field">
                <i data-lucide="lock" class="w-[18px] h-[18px]"></i>
                <input type="password" autocomplete="new-password" x-model="authForm.password" placeholder="Contraseña (mín. 6 caracteres)" required>
              </label>
              <label class="auth-field">
                <i data-lucide="lock" class="w-[18px] h-[18px]"></i>
                <input type="password" autocomplete="new-password" x-model="authForm.password2" placeholder="Confirma tu contraseña" required>
              </label>
              <p x-show="authError" class="text-[13px] font-medium text-rose-500 dark:text-rose-400" x-text="authError"></p>

              <button type="submit" :disabled="authBusy" class="auth-cta mt-3 self-end">
                <span x-show="!authBusy">Crear cuenta</span>
                <span x-show="authBusy">Creando…</span>
                <i data-lucide="arrow-right" class="w-4 h-4"></i>
              </button>
            </form>
          </div>
        </template>

        <!-- OLVIDÉ MI CONTRASEÑA (código de recuperación) -->
        <template x-if="authScreen === 'forgot'">
          <div class="anim-rise">
            <h2 class="text-[28px] leading-tight font-bold tracking-tight mb-1.5" style="color: var(--text)">Recuperar acceso</h2>
            <p class="text-sm mb-7" style="color: var(--text-muted)">Usa el código de recuperación que guardaste al crear tu cuenta.</p>
            <form @submit.prevent="submitReset" class="flex flex-col gap-3.5">
              <label class="auth-field">
                <i data-lucide="key-round" class="w-[18px] h-[18px]"></i>
                <input type="text" x-model="authForm.recoveryCode" placeholder="XXXX-XXXX-XXXX" class="text-center tracking-widest uppercase" required>
              </label>
              <label class="auth-field">
                <i data-lucide="lock" class="w-[18px] h-[18px]"></i>
                <input type="password" autocomplete="new-password" x-model="authForm.newPassword" placeholder="Nueva contraseña" required>
              </label>
              <p x-show="authError" class="text-[13px] font-medium text-rose-500 dark:text-rose-400" x-text="authError"></p>
              <button type="submit" :disabled="authBusy" class="auth-cta mt-3 self-end">
                <span x-show="!authBusy">Restablecer contraseña</span>
                <span x-show="authBusy">Verificando…</span>
                <i data-lucide="arrow-right" class="w-4 h-4"></i>
              </button>
            </form>
          </div>
        </template>

        <!-- CÓDIGO DE RECUPERACIÓN (se muestra una sola vez) -->
        <template x-if="authScreen === 'recovery-reveal'">
          <div class="anim-rise text-center">
            <div class="w-14 h-14 mx-auto mb-4 rounded-2xl bg-amber-500/15 text-amber-500 dark:text-amber-400 grid place-items-center"><i data-lucide="key-round" class="w-7 h-7"></i></div>
            <h2 class="text-xl font-bold mb-1.5" style="color: var(--text)">Guarda tu código de recuperación</h2>
            <p class="text-sm mb-5" style="color: var(--text-muted)">Es la única forma de recuperar tu cuenta si olvidas tu contraseña. No se mostrará de nuevo.</p>
            <div class="rounded-2xl py-4 px-3 mb-5" style="background: var(--surface); border: 1px solid var(--border)">
              <p class="text-2xl font-bold tracking-[0.15em] tabular-nums" style="color: var(--text)" x-text="recoveryCodeToShow"></p>
            </div>
            <button @click="copyRecoveryCode()" class="btn-ghost w-full justify-center mb-3">
              <i data-lucide="copy" class="w-4 h-4"></i> Copiar código
            </button>
            <button @click="completeLogin()" class="auth-cta w-full">Ya lo guardé, continuar</button>
          </div>
        </template>
      </div>
    </div>

    <!-- ============ "EMPECEMOS" (configuración inicial, solo tras registrarte) ============ -->
    <div x-show="setupActive" x-cloak class="fixed inset-0 z-[91] overflow-y-auto" style="background: var(--bg)">
      <div class="relative w-full max-w-sm mx-auto px-6 pt-8 pb-10 min-h-screen flex flex-col justify-center">

        <!-- Paso 0: intro -->
        <template x-if="setupStep === 0">
          <div class="anim-rise text-center">
            <div class="w-16 h-16 mx-auto mb-5 rounded-[28px] grid place-items-center text-white" style="background-image: var(--brand-gradient)">
              <i data-lucide="sparkles" class="w-8 h-8"></i>
            </div>
            <h2 class="text-2xl font-bold tracking-tight mb-2" style="color: var(--text)">¡Empecemos!</h2>
            <p class="text-sm leading-relaxed mb-8" style="color: var(--text-muted)">Un par de preguntas rápidas para dejar tu cuenta lista — menos de un minuto.</p>
            <button @click="setupNext()" class="auth-cta w-full justify-center mb-3">Comenzar <i data-lucide="arrow-right" class="w-4 h-4"></i></button>
            <button @click="skipSetup()" class="auth-link text-sm">Omitir, lo configuro después</button>
          </div>
        </template>

        <!-- Paso 1: presupuesto -->
        <template x-if="setupStep === 1">
          <div class="anim-rise">
            <p class="text-[11px] font-semibold uppercase tracking-wider mb-2" style="color: var(--text-muted)">Paso 1 de 3</p>
            <h2 class="text-2xl font-bold tracking-tight mb-1.5" style="color: var(--text)">¿Cuál es tu presupuesto mensual?</h2>
            <p class="text-sm mb-6" style="color: var(--text-muted)">Te ayuda a ver cuánto llevas gastado cada mes. Puedes usar tu ingreso mensual como referencia, y cambiarlo cuando quieras.</p>
            <label class="auth-field mb-6">
              <i data-lucide="wallet" class="w-[18px] h-[18px]"></i>
              <input type="number" min="0" inputmode="decimal" x-model="setupBudget" placeholder="Ej. 2000000">
            </label>
            <div class="flex items-center gap-3">
              <button @click="setupBack()" class="btn-icon" style="background: var(--surface); border: 1px solid var(--border)" aria-label="Atrás"><i data-lucide="chevron-left" class="w-5 h-5"></i></button>
              <button @click="setupNext()" class="auth-cta flex-1 justify-center">Siguiente <i data-lucide="arrow-right" class="w-4 h-4"></i></button>
            </div>
            <button @click="skipSetup()" class="auth-link text-sm mt-5 block mx-auto">Omitir</button>
          </div>
        </template>

        <!-- Paso 2: cuentas -->
        <template x-if="setupStep === 2">
          <div class="anim-rise">
            <p class="text-[11px] font-semibold uppercase tracking-wider mb-2" style="color: var(--text-muted)">Paso 2 de 3</p>
            <h2 class="text-2xl font-bold tracking-tight mb-1.5" style="color: var(--text)">¿Qué cuentas usas?</h2>
            <p class="text-sm mb-5" style="color: var(--text-muted)">Elige las que tengas. Puedes agregar más después desde Cuentas.</p>
            <div class="space-y-2 mb-6 max-h-[42vh] overflow-y-auto pr-1">
              <template x-for="a in setupAccounts" :key="a.id">
                <div class="rounded-2xl border transition" :class="a.selected ? 'border-accent/40 bg-accent/5' : 'border-[color:var(--border)]'">
                  <button type="button" @click="setupToggleAccount(a.id)" class="w-full flex items-center gap-3 px-3.5 py-3">
                    <span class="w-8 h-8 rounded-xl grid place-items-center shrink-0" :style="`background:${a.color}1a;color:${a.color}`"><i :data-lucide="a.icon" class="w-4 h-4"></i></span>
                    <span class="flex-1 text-left text-sm font-medium" :style="a.selected ? 'color: var(--text)' : 'color: var(--text-muted)'" x-text="a.label"></span>
                    <span class="relative inline-flex h-6 w-11 shrink-0 rounded-full transition" :class="a.selected ? 'bg-accent' : 'bg-slate-200 dark:bg-slate-700'">
                      <span class="absolute top-0.5 left-0.5 w-5 h-5 rounded-full bg-white shadow transition-all duration-200" :class="a.selected ? 'translate-x-5' : ''"></span>
                    </span>
                  </button>
                  <div x-show="a.selected" x-cloak class="px-3.5 pb-3 -mt-1">
                    <input type="number" min="0" inputmode="decimal" x-model="a.balance" placeholder="Saldo inicial (opcional)" class="field text-sm py-2">
                  </div>
                </div>
              </template>
            </div>
            <div class="flex items-center gap-3">
              <button @click="setupBack()" class="btn-icon" style="background: var(--surface); border: 1px solid var(--border)" aria-label="Atrás"><i data-lucide="chevron-left" class="w-5 h-5"></i></button>
              <button @click="setupNext()" class="auth-cta flex-1 justify-center">Siguiente <i data-lucide="arrow-right" class="w-4 h-4"></i></button>
            </div>
            <button @click="skipSetup()" class="auth-link text-sm mt-5 block mx-auto">Omitir</button>
          </div>
        </template>

        <!-- Paso 3: resumen -->
        <template x-if="setupStep === 3">
          <div class="anim-rise text-center">
            <div class="w-14 h-14 mx-auto mb-4 rounded-2xl bg-emerald-500/15 text-emerald-500 grid place-items-center"><i data-lucide="check" class="w-7 h-7"></i></div>
            <h2 class="text-xl font-bold mb-1.5" style="color: var(--text)">¡Todo listo!</h2>
            <p class="text-sm mb-6 leading-relaxed" style="color: var(--text-muted)">
              <template x-if="setupBudget"><span>Presupuesto mensual: <strong x-text="fmt(parseFloat(setupBudget) || 0)"></strong><br></span></template>
              <span x-text="`${setupAccounts.filter(a => a.selected).length} cuenta(s) configurada(s)`"></span>
            </p>
            <button @click="finishSetup()" class="auth-cta w-full justify-center">Comenzar a usar GastosDiarios</button>
          </div>
        </template>
      </div>
    </div>

    <!-- Pantalla de bloqueo (PIN) -->
    <div x-show="locked" x-cloak class="fixed inset-0 z-[90] bg-slate-950/90 backdrop-blur-xl grid place-items-center p-4">
      <div class="w-full max-w-xs text-center">
        <div class="w-16 h-16 mx-auto mb-5 rounded-3xl bg-gradient-to-br from-accent to-violet-600 text-white grid place-items-center shadow-lg shadow-accent/30">
          <i data-lucide="lock" class="w-8 h-8"></i>
        </div>
        <h2 class="text-xl font-bold mb-1 text-white">App bloqueada</h2>
        <p class="text-sm text-slate-400 mb-6">Ingresa tu PIN para continuar.</p>
        <input type="password" inputmode="numeric" maxlength="6" x-model="pinInput" @keydown.enter="unlockApp"
          class="field text-center text-lg tracking-[0.5em] tabular-nums bg-slate-900 text-white border-slate-700 focus:border-accent" placeholder="••••••">
        <p x-show="pinError" class="text-[13px] font-medium text-rose-400 mt-3" x-text="pinError"></p>
        <button @click="unlockApp" class="mt-5 w-full inline-flex items-center justify-center gap-2 rounded-2xl bg-accent text-white px-4 py-3 text-sm font-semibold shadow-lg shadow-accent/30 transition hover:brightness-110 active:scale-[.98]">
          <i data-lucide="unlock" class="w-4 h-4"></i> Desbloquear
        </button>
      </div>
    </div>

    <!-- Overlay móvil -->
    <div x-show="sidebarOpen" x-cloak x-transition.opacity @click="sidebarOpen = false"
      class="fixed inset-0 z-40 bg-slate-900/40 backdrop-blur-sm lg:hidden"></div>

    <!-- ============ SIDEBAR ============ -->
    <aside
      class="app-sidebar fixed inset-y-0 left-0 z-50 flex flex-col bg-[color:var(--bg)] dark:bg-[#0A0B10] transition-all duration-300 lg:translate-x-0"
      :class="[sidebarCollapsed ? 'lg:w-[84px] w-[264px]' : 'w-[264px]', sidebarOpen ? 'translate-x-0' : '-translate-x-full']">

      <!-- Logo -->
      <div class="flex items-center gap-3 px-6 pt-7 pb-6" :class="sidebarCollapsed ? 'lg:justify-center lg:px-0' : ''">
        <div class="w-11 h-11 rounded-2xl grid place-items-center bg-accent text-white shadow-lg shadow-accent/30 overflow-hidden shrink-0">
          <template x-if="config.brand.logoImage">
            <img :src="config.brand.logoImage" alt="" class="w-full h-full object-cover">
          </template>
          <template x-if="!config.brand.logoImage">
            <i :data-lucide="config.brand.logoIcon" class="w-6 h-6"></i>
          </template>
        </div>
        <div class="min-w-0 flex-1" x-show="!sidebarCollapsed">
          <h1 class="font-bold tracking-tight truncate" x-text="config.brand.name"></h1>
          <p class="text-xs text-slate-400 truncate" x-text="config.brand.tagline"></p>
        </div>
        <button @click="sidebarCollapsed = !sidebarCollapsed" class="btn-icon w-8 h-8 hidden lg:inline-flex shrink-0" :title="sidebarCollapsed ? 'Expandir menú' : 'Colapsar menú'">
          <i x-show="!sidebarCollapsed" data-lucide="panel-left-close" class="w-4 h-4"></i>
          <i x-show="sidebarCollapsed" data-lucide="panel-left-open" class="w-4 h-4"></i>
        </button>
      </div>

      <!-- Saludo -->
      <div class="px-6 pb-5" x-show="!sidebarCollapsed">
        <h2 class="text-[26px] leading-tight font-bold tracking-tight">Hola,<br><span x-text="config.brand.name"></span></h2>
        <p class="mt-1.5 text-xs text-slate-400">Tu resumen financiero actual</p>
      </div>

      <!-- Navegación (HOME) + bolsillos (POCKET) -->
      <nav class="flex-1 px-4 overflow-y-auto">
        <p class="px-2.5 text-[11px] font-semibold uppercase tracking-wider text-slate-400 mb-2" x-show="!sidebarCollapsed">Menú</p>
        <div class="space-y-1">
          <template x-for="nav in navItems" :key="nav.id">
            <button @click="goTo(nav.id)"
              class="w-full flex items-center gap-3 rounded-2xl px-3.5 py-2.5 text-sm font-medium transition"
              :class="[view === nav.id ? 'text-white shadow-md' : 'text-slate-500 dark:text-slate-400 hover:bg-white/70 dark:hover:bg-slate-800 hover:text-slate-900 dark:hover:text-slate-100', sidebarCollapsed ? 'lg:justify-center' : '']"
              :style="view === nav.id ? 'background:var(--ink)' : ''"
              :title="sidebarCollapsed ? nav.label : null">
              <i :data-lucide="nav.icon" class="w-5 h-5 shrink-0"></i>
              <span x-show="!sidebarCollapsed" x-text="nav.label" class="flex-1 text-left"></span>
              <i x-show="!sidebarCollapsed && view === nav.id" data-lucide="chevron-right" class="w-4 h-4 shrink-0"></i>
            </button>
          </template>
        </div>

        <!-- Bolsillos (cuentas) -->
        <div class="mt-6" x-show="!sidebarCollapsed">
          <div class="flex items-center justify-between px-2.5 mb-2">
            <p class="text-[11px] font-semibold uppercase tracking-wider text-slate-400">Bolsillos</p>
            <button @click="goTo('cuentas')" class="w-6 h-6 rounded-full bg-accent text-white grid place-items-center transition hover:brightness-110 active:scale-95" aria-label="Gestionar cuentas">
              <i data-lucide="plus" class="w-3.5 h-3.5"></i>
            </button>
          </div>
          <div class="space-y-1">
            <template x-for="a in activeAccounts.slice(0, 4)" :key="a.id">
              <button @click="goTo('cuentas')" class="w-full flex items-center gap-3 rounded-2xl px-3 py-2 text-sm font-medium text-slate-500 dark:text-slate-400 hover:bg-white/70 dark:hover:bg-slate-800 hover:text-slate-900 dark:hover:text-slate-100 transition">
                <span class="w-7 h-7 rounded-lg grid place-items-center shrink-0" :style="`background:${a.color}1a;color:${a.color}`"><i :data-lucide="a.icon" class="w-4 h-4"></i></span>
                <span class="flex-1 text-left truncate" x-text="a.name"></span>
              </button>
            </template>
            <template x-if="activeAccounts.length === 0">
              <p class="px-3 py-2 text-xs text-slate-400">Sin cuentas aún</p>
            </template>
          </div>
        </div>
      </nav>

      <!-- Tarjeta promocional (mensaje útil de la app) -->
      <div class="px-4 pb-5" x-show="!sidebarCollapsed">
        <div class="relative overflow-hidden rounded-3xl p-5 text-white" style="background:rgb(var(--accent))">
          <span class="absolute -bottom-8 -right-8 w-28 h-28 rounded-full bg-white/10"></span>
          <p class="relative text-lg font-bold leading-snug">Organiza tus<br>finanzas</p>
          <p class="relative mt-1 text-xs text-white/75">Pregúntale a tu asistente IA</p>
          <button @click="goTo('asistente')" class="relative mt-4 w-10 h-10 rounded-full grid place-items-center text-white transition hover:brightness-125 active:scale-95" style="background:var(--ink)" aria-label="Abrir asistente">
            <i data-lucide="arrow-up-right" class="w-5 h-5"></i>
          </button>
        </div>
      </div>

      <!-- Colapsado: acceso a configuración -->
      <div class="px-4 pb-5 hidden" :class="sidebarCollapsed ? 'lg:block' : ''">
        <button @click="openConfig" class="btn-icon w-10 h-10 mx-auto" title="Configuración"><i data-lucide="settings-2" class="w-5 h-5"></i></button>
      </div>
    </aside>

    <!-- ============ CONTENIDO ============ -->
    <div class="app-content" :class="sidebarCollapsed ? 'lg:pl-[84px]' : 'lg:pl-[264px]'">

      <!-- Contenedor principal (shell): blanco-grisáceo, esquinas redondeadas -->
      <div class="app-shell m-3 lg:my-4 lg:ml-2 lg:mr-4 overflow-hidden min-h-[calc(100dvh-1.5rem)]">

      <!-- Topbar -->
      <header class="app-topbar relative z-30 flex items-center gap-2 lg:gap-3 h-[76px] px-4 lg:px-6">
        <button @click="sidebarOpen = true" class="circle-btn w-10 h-10 lg:hidden shrink-0" aria-label="Abrir menú">
          <i data-lucide="menu" class="w-5 h-5"></i>
        </button>

        <!-- Pestañas tipo pill (navegación principal) -->
        <nav class="flex-1 min-w-0 overflow-x-auto no-scrollbar cursor-grab" x-init="dragScroll($el)" data-tour="tour-nav">
          <div class="flex items-center gap-2 w-max px-0.5 py-1">
            <template x-for="nav in navItems" :key="nav.id">
              <button @click="goTo(nav.id)" class="pill shrink-0" :class="(view === nav.id && !showConfig) ? 'pill-active' : ''" :data-tour="nav.id === 'asistente' ? 'tour-ai' : null">
                <i :data-lucide="nav.icon" class="w-4 h-4"></i>
                <span x-text="nav.label"></span>
              </button>
            </template>
          </div>
        </nav>

        <!-- Selector de mes (compacto) -->
        <div class="hidden xl:flex items-center gap-1 rounded-full p-1 shrink-0" style="background:var(--surface-2)">
          <button @click="changeMonth(-1)" class="w-7 h-7 grid place-items-center rounded-full text-slate-500 transition hover:bg-white dark:hover:bg-slate-700 active:scale-95" aria-label="Mes anterior"><i data-lucide="chevron-left" class="w-4 h-4"></i></button>
          <span class="text-xs font-semibold w-24 text-center tabular-nums" x-text="monthLabel"></span>
          <button @click="changeMonth(1)" class="w-7 h-7 grid place-items-center rounded-full text-slate-500 transition hover:bg-white dark:hover:bg-slate-700 active:scale-95" aria-label="Mes siguiente"><i data-lucide="chevron-right" class="w-4 h-4"></i></button>
        </div>

        <!-- Acciones derechas -->
        <div class="flex items-center gap-2 shrink-0">
          <button x-show="state.privacy.hideAmounts" @click="revealAmounts = !revealAmounts" class="circle-btn w-10 h-10" :title="revealAmounts ? 'Ocultar montos' : 'Mostrar montos'" aria-label="Revelar montos">
            <i :data-lucide="revealAmounts ? 'eye-off' : 'eye'" class="w-[18px] h-[18px]"></i>
          </button>
          <button @click="mode = isDark ? 'light' : 'dark'" class="circle-btn w-10 h-10" :aria-label="isDark ? 'Activar modo claro' : 'Activar modo oscuro'">
            <i x-show="!isDark" data-lucide="moon" class="w-[18px] h-[18px]"></i>
            <i x-show="isDark" data-lucide="sun" class="w-[18px] h-[18px]"></i>
          </button>
          <button @click="openConfig" class="circle-btn w-10 h-10 hidden sm:inline-grid" aria-label="Configuración">
            <i data-lucide="settings" class="w-[18px] h-[18px]"></i>
          </button>

        <!-- Notificaciones -->
        <div class="relative">
          <button @click="notifOpen = !notifOpen; profileOpen = false" class="circle-btn w-10 h-10 relative" aria-label="Notificaciones">
            <i data-lucide="bell" class="w-[18px] h-[18px]"></i>
            <span x-show="alertCount > 0" x-cloak
              class="absolute -top-0.5 -right-0.5 min-w-[18px] h-[18px] px-1 rounded-full bg-rose-500 text-white text-[10px] font-bold grid place-items-center"
              x-text="alertCount"></span>
          </button>
          <div x-show="notifOpen" x-cloak @click.outside="notifOpen = false"
            x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0 -translate-y-1 scale-95" x-transition:enter-end="opacity-100 translate-y-0 scale-100"
            x-transition:leave="transition ease-in duration-150" x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0"
            class="absolute right-0 mt-2 w-80 rounded-3xl border border-slate-200/70 dark:border-slate-800 bg-white dark:bg-slate-900 shadow-xl p-3 z-40">
            <p class="px-2 pt-1 pb-2 text-xs font-semibold uppercase tracking-wider text-slate-400">Notificaciones</p>
            <template x-if="notifications.length === 0">
              <p class="text-sm text-slate-400 px-2 pb-2 py-1">Todo en orden. Sin avisos por ahora.</p>
            </template>
            <template x-for="(n, i) in notifications" :key="i">
              <div class="flex items-start gap-3 px-2 py-2.5 rounded-2xl hover:bg-slate-50 dark:hover:bg-slate-800/60">
                <div class="w-9 h-9 rounded-xl grid place-items-center shrink-0"
                  :class="n.tone === 'danger' ? 'bg-rose-50 text-rose-500 dark:bg-rose-500/10 dark:text-rose-400' : n.tone === 'warn' ? 'bg-amber-50 text-amber-500 dark:bg-amber-500/10 dark:text-amber-400' : 'bg-emerald-50 text-emerald-500 dark:bg-emerald-500/10 dark:text-emerald-400'">
                  <i :data-lucide="n.icon" class="w-4 h-4"></i>
                </div>
                <p class="text-sm text-slate-600 dark:text-slate-300" x-text="n.text"></p>
              </div>
            </template>
          </div>
        </div>

        <!-- Perfil -->
        <div class="relative">
          <button @click="profileOpen = !profileOpen; notifOpen = false" data-tour="tour-settings" class="flex items-center gap-2.5 rounded-full p-1 sm:pr-3 transition hover:bg-[color:var(--surface-2)] active:scale-95">
            <span class="w-9 h-9 rounded-full grid place-items-center bg-accent text-white text-sm font-bold shrink-0">
              <span x-text="config.brand.name.slice(0, 2).toUpperCase()"></span>
            </span>
            <span class="hidden sm:block text-left leading-tight">
              <span class="block text-sm font-semibold truncate max-w-[130px]" x-text="config.brand.name"></span>
              <span class="block text-xs text-slate-400">Datos locales</span>
            </span>
            <i data-lucide="chevron-down" class="w-4 h-4 text-slate-400 hidden sm:block"></i>
          </button>
          <div x-show="profileOpen" x-cloak @click.outside="profileOpen = false"
            x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0 -translate-y-1 scale-95" x-transition:enter-end="opacity-100 translate-y-0 scale-100"
            x-transition:leave="transition ease-in duration-150" x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0"
            class="absolute right-0 mt-2 w-60 rounded-3xl border border-slate-200/70 dark:border-slate-800 bg-white dark:bg-slate-900 shadow-xl p-2 z-40">
            <button @click="openConfig" class="w-full flex items-center gap-2.5 px-3 py-2.5 rounded-2xl text-sm font-medium hover:bg-slate-50 dark:hover:bg-slate-800">
              <i data-lucide="settings-2" class="w-4 h-4 text-slate-400"></i> Configuración
            </button>
            <button @click="doExport(); profileOpen = false" class="w-full flex items-center gap-2.5 px-3 py-2.5 rounded-2xl text-sm font-medium hover:bg-slate-50 dark:hover:bg-slate-800">
              <i data-lucide="download" class="w-4 h-4 text-slate-400"></i> Exportar datos
            </button>
            <label class="w-full flex items-center gap-2.5 px-3 py-2.5 rounded-2xl text-sm font-medium hover:bg-slate-50 dark:hover:bg-slate-800 cursor-pointer">
              <i data-lucide="upload" class="w-4 h-4 text-slate-400"></i> Importar datos
              <input type="file" accept=".json" class="hidden" @change="doImport">
            </label>
            <div class="my-1.5 border-t border-slate-100 dark:border-slate-800"></div>
            <button @click="logout()" class="w-full flex items-center gap-2.5 px-3 py-2.5 rounded-2xl text-sm font-medium text-rose-600 dark:text-rose-400 hover:bg-rose-50 dark:hover:bg-rose-500/10">
              <i data-lucide="log-out" class="w-4 h-4"></i> Cerrar sesión
            </button>
          </div>
        </div>
        </div><!-- /acciones derechas -->
      </header>

      <main class="app-main px-5 lg:px-8 pb-6 lg:pb-8 space-y-8">

        <!-- Vistas: se cargan desde /views (loadPartials) y solo se muestra la activa. -->
        <div x-show="!showConfig" class="space-y-8">
          <div data-partial="inicio"></div>
          <div data-partial="cuentas"></div>
          <div data-partial="movimientos"></div>
          <div data-partial="presupuestos"></div>
          <div data-partial="reportes"></div>
          <div data-partial="metas"></div>
          <div data-partial="deudas"></div>
          <div data-partial="patrimonio"></div>
          <div data-partial="calendario"></div>
          <div data-partial="recurrentes"></div>
          <div data-partial="categorias"></div>
          <div data-partial="asistente"></div>
        </div>

        <!-- Configuración: pantalla aparte (desde el perfil) -->
        <div data-partial="config"></div>

        <footer class="text-center text-xs text-slate-400 pt-2 pb-4">
          Tus datos se guardan localmente en tu navegador · <button @click="doExport" class="font-medium hover:text-accent">Exportar respaldo</button>
        </footer>
      </main>
      </div><!-- /app-shell -->
    </div>

    <!-- ============ BOTÓN FLOTANTE (FAB) ============ -->
    <div id="fab" x-show="!(view === 'asistente' && !showConfig)" class="fixed bottom-7 right-7 z-40 flex flex-col items-end">
      <div x-show="fabOpen" x-cloak @click.outside="fabOpen = false"
        x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0 translate-y-2 scale-95" x-transition:enter-end="opacity-100 translate-y-0 scale-100"
        x-transition:leave="transition ease-in duration-150" x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0"
        class="mb-3 w-64 rounded-3xl border border-slate-200/70 dark:border-slate-800 bg-white dark:bg-slate-900 shadow-2xl p-2 space-y-1">
        <p class="px-3 pt-2 pb-1 text-xs font-semibold uppercase tracking-wider text-slate-400">Nuevo movimiento</p>
        <button @click="openTxModal('expense')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-2xl text-sm font-medium transition hover:bg-slate-50 dark:hover:bg-slate-800">
          <span class="w-8 h-8 rounded-xl grid place-items-center bg-rose-50 text-rose-500 dark:bg-rose-500/10 dark:text-rose-400"><i data-lucide="credit-card" class="w-4 h-4"></i></span>
          Agregar gasto
        </button>
        <button @click="openTxModal('income')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-2xl text-sm font-medium transition hover:bg-slate-50 dark:hover:bg-slate-800">
          <span class="w-8 h-8 rounded-xl grid place-items-center bg-emerald-50 text-emerald-500 dark:bg-emerald-500/10 dark:text-emerald-400"><i data-lucide="trending-up" class="w-4 h-4"></i></span>
          Agregar ingreso
        </button>
        <button @click="openTxModal('transfer')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-2xl text-sm font-medium transition hover:bg-slate-50 dark:hover:bg-slate-800">
          <span class="w-8 h-8 rounded-xl grid place-items-center bg-sky-50 text-sky-500 dark:bg-sky-500/10 dark:text-sky-400"><i data-lucide="arrow-right-left" class="w-4 h-4"></i></span>
          Transferir dinero
        </button>
      </div>
      <button @click="fabOpen = !fabOpen; notifOpen = false; profileOpen = false" aria-label="Nuevo movimiento"
        style="background-image: var(--brand-gradient)"
        class="w-14 h-14 rounded-2xl text-white grid place-items-center shadow-lg shadow-accent/40 hover:scale-105 hover:shadow-xl transition active:scale-95"
        :class="fabOpen ? 'rotate-45' : ''">
        <i x-show="!fabOpen" data-lucide="plus" class="w-6 h-6"></i>
        <i x-show="fabOpen" data-lucide="x" class="w-6 h-6"></i>
      </button>
    </div>

    <!-- ============ MODALES (cargados desde /views/modals) ============ -->
    <div data-partial="modals/movimiento"></div>
    <div data-partial="modals/cuenta"></div>
    <div data-partial="modals/categoria"></div>
    <div data-partial="modals/recurrente"></div>
    <div data-partial="modals/meta"></div>
    <div data-partial="modals/aporte-meta"></div>
    <div data-partial="modals/deuda"></div>
    <div data-partial="modals/pago-deuda"></div>
    <div data-partial="modals/confirmacion"></div>
    <div data-partial="modals/reasignar-categoria"></div>
    <div data-partial="modals/busqueda-global"></div>
    <div data-partial="modals/analisis-datos"></div>

    <!-- ============ TUTORIAL GUIADO (spotlight sobre la UI real) ============ -->
    <template x-if="tourActive && tourPad">
      <div class="fixed inset-0 z-[85] pointer-events-none">
        <div class="absolute bg-slate-950/55 transition-all duration-300" :style="tourBoxStyle('top')"></div>
        <div class="absolute bg-slate-950/55 transition-all duration-300" :style="tourBoxStyle('bottom')"></div>
        <div class="absolute bg-slate-950/55 transition-all duration-300" :style="tourBoxStyle('left')"></div>
        <div class="absolute bg-slate-950/55 transition-all duration-300" :style="tourBoxStyle('right')"></div>
        <div class="absolute rounded-2xl transition-all duration-300" :style="tourBoxStyle('ring') + ';box-shadow:0 0 0 2px rgb(var(--accent) / .9), 0 0 0 6px rgb(var(--accent) / .25)'"></div>
      </div>
    </template>

    <template x-if="tourActive">
      <div class="fixed z-[86] w-[320px] max-w-[90vw] rounded-3xl p-5 shadow-2xl transition-all duration-300 bg-[color:var(--surface)] border border-[color:var(--border)]"
        :style="`top:${tourPos.top}px;left:${tourPos.left}px`">
        <div class="flex items-center justify-between gap-2 mb-2">
          <span class="text-[11px] font-semibold uppercase tracking-wider" style="color: var(--text-muted)" x-text="`Paso ${tourStep + 1} de ${tourSteps.length}`"></span>
          <button @click="endTour(false)" class="btn-icon w-7 h-7" aria-label="Cerrar tutorial"><i data-lucide="x" class="w-3.5 h-3.5"></i></button>
        </div>
        <h3 class="text-base font-bold tracking-tight mb-1.5" style="color: var(--text)" x-text="tourSteps[tourStep]?.title"></h3>
        <p class="text-sm leading-relaxed mb-4" style="color: var(--text-muted)" x-text="tourSteps[tourStep]?.text"></p>
        <div class="flex items-center gap-3">
          <div class="flex items-center gap-1.5 flex-1">
            <template x-for="(s, i) in tourSteps" :key="i">
              <span class="h-1.5 rounded-full transition-all" :class="i === tourStep ? 'w-5' : 'w-1.5'" :style="i === tourStep ? 'background: rgb(var(--accent))' : 'background: var(--border)'"></span>
            </template>
          </div>
          <button x-show="tourStep < tourSteps.length - 1" @click="endTour(false)" class="text-xs font-semibold shrink-0" style="color: var(--text-muted)">Saltar</button>
          <button @click="tourNext()" class="btn-primary shrink-0">
            <span x-text="tourStep < tourSteps.length - 1 ? 'Siguiente' : 'Listo'"></span>
          </button>
        </div>
      </div>
    </template>

    <!-- Toast -->
    <div id="toast" x-show="toast" x-cloak
      x-transition:enter="transition duration-300" x-transition:enter-start="translate-y-32 opacity-0" x-transition:enter-end="translate-y-0 opacity-100"
      x-transition:leave="transition duration-200" x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0"
      class="fixed bottom-7 left-1/2 -translate-x-1/2 bg-slate-900 dark:bg-white text-white dark:text-slate-900 px-5 py-3 rounded-full text-[13px] font-medium shadow-xl z-[80] max-w-[90vw] flex items-center gap-4">
      <span x-text="toast"></span>
      <button x-show="toastActionLabel" @click="runToastAction"
        class="shrink-0 font-bold text-accent underline decoration-2 underline-offset-2 hover:opacity-80"
        x-text="toastActionLabel"></button>
    </div>

  </div>
</body>
</html>
